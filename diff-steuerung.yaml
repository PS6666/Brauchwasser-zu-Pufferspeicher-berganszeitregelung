# ===================================================================================
# AUTOMATISCHE ANLAGENSTEUERUNG – DER UNIVERSELLE CODE-STANDARD (FINALES BACKUP)
# ===================================================================================

# --- GLOBALE ZAHLENSPEICHER FÜR DIE BERECHNETEN TAGESMINUTEN (CPU-ENTLASTUNG) ---
globals:
  - id: lade_von_min
    type: int
    initial_value: "690"  # 11:30 Uhr in Minuten
  - id: lade_bis_min
    type: int
    initial_value: "990"  # 16:30 Uhr in Minuten
  - id: entlade_von_min
    type: int
    initial_value: "330"  # 05:30 Uhr in Minuten
  - id: entlade_bis_min
    type: int
    initial_value: "450"  # 07:30 Uhr in Minuten
  - id: sensor_reboot_count
    type: int
    restore_value: yes
    initial_value: "0"
  - id: sensor_hard_fault
    type: bool
    restore_value: yes
    initial_value: "false"
    
# --- ZENTRALE HARDWARE-, NETZWERK- & REGELUNGS-KONSTANTEN ---
substitutions:
  # 1. Physische GPIO-Pinbelegung (Exakt nach dem Pinout-Diagramm)
  pin_bus_bw: "GPIO4"            # Äußerer Board-Aufdruck: Pin 4
  pin_bus_puf_ob: "GPIO5"        # Äußerer Board-Aufdruck: Pin 5
  pin_bus_puf_unt: "GPIO6"       # Äußerer Board-Aufdruck: Pin 6
  pin_bus_hk_vl: "GPIO7"         # Äußerer Board-Aufdruck: Pin 7
  pin_bus_hk_rl: "GPIO8"         # Äußerer Board-Aufdruck: Pin 8
  pin_bus_kes: "GPIO9"           # Äußerer Board-Aufdruck: Pin 9
  pin_bus_hk2_vl: "GPIO10"       # Äußerer Board-Aufdruck: Pin 10
  pin_bus_hk2_rl: "GPIO11"       # Äußerer Board-Aufdruck: Pin 11
  
  # Variables Abfrage-Intervall für alle Sensoren und Berechnungen
  sensor_intval_time: "5000ms"   # Sensoren abfrage intervall
  
  # Relais-Pins (Platzierung auf den Klemmen der rechten oberen Board-Seite)
  pin_relais_1: "GPIO1"          # Äußerer Board-Aufdruck: Pin 1 (Ladepumpe)
  pin_relais_2: "GPIO2"          # Äußerer Board-Aufdruck: Pin 2 (ESBE-Widerstand)
  pin_relais_3: "GPIO12"         # Äußerer Board-Aufdruck: Pin 12 (Feuerungsfreigabe)
  
  # 2. Logische Namen & Hardware-Eigenschaften
  sensor1_bw: "Brauchwassertemperatur"
  sensor2_puf_ob: "Pufferspeicher oben"
  sensor3_puf_unt: "Pufferspeicher unten"
  sensor4_hk_vl: "Heizkreis vorlauf"
  sensor5_hk_rl: "Heizkreis rücklauf"
  sensor6_kes: "Kessel Temperatur"
  sensor7_hk2_vl: "Wohnen2 vorlauf" 
  sensor8_hk2_rl: "Wohnen2 rücklauf"
  
  bwsp_vol: "300"                # Brauchwasserspeichervolumen in Liter
  puffsp_vol: "800"              # Pufferspeichervolumen in Liter
  bw_max_lad: "65"               # Brauchwasser Maximaltemperatur
  puff_max_lad: "75"             # Pufferspeicher Maximaltemperatur
  win_puff_ob: "45"              # Wintermodus Ladestart für Brauchwasser
  
  relais_1_name: "Ladepumpe"     
  relais_2_name: "ESBE 95-1 Komfort Widerstand" 
  relais_3_name: "Feuerungsfreigabe"
  tasmota_ip_fest: "192.168.200.106"
  tasmota_realname: "ESBE95-1 Hauptstrom Nous A8T" 
  zeitserver1: "fritz.box"
  
  # 3. Zentrale Logik-Umkehr für Low-Level-Relaisplatinen
  relais_invertiert: "true"      # 'false' für High-Level, 'true' für Low-Level

  # 4. Zentrale Taktung & Hardware-Parameter
  regel_takt: "5s"               # Intervall-Takt des Hauptreglers
  pumpe_min_on_ms: "30000"       # Mindestlaufzeit der Ladepumpe in ms (30 Sek.)
  puffer_max_wert: "75"          # Maximale Schutztemperatur Pufferspeicher in °C
  status_led_pin: "GPIO48"       # Pin der internen Board-RGB-LED zum Deaktivieren

  # 5. Zentraler Standard-Volumenstrom für die Alpha 2 (bei ca. 11 Watt / AUTOADAPT)
  mitt_durchfl: "600"            # Mittlerer Durchfluss in Liter pro Stunde (l/h)
  woh2_mitt_durchfluss: "200"
  
# --- S3 STATUS LED AUSSCHALTUNG ---
status_led:
  pin:
    number: ${status_led_pin}
    inverted: true  

# --- SYSTEM-START-PRIORISIERUNG ---
esphome:
  name: diffsteuerung
  friendly_name: "Steuerung Überganszeit"
  on_boot:
    priority: -100.0         # Wartet, bis WLAN und Sensoren stabil laufen
    then:
      - delay: 5s            # Erhöht auf 5s, um neuen Sensoren Zeit zum Starten zu geben
      - script.execute: pruefe_hauptsensoren

# --- HARDWARE-ARCHITEKTUR ---
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  id: "status_led_board"
  framework:
    type: esp-idf
    
api:
  encryption:
    key: 0/GTBGTdpcgjyc2maLUYUvQs0caz97Ikfb9IF2crpUc=
  reboot_timeout: 30min
  
# --- NETZWERK-KONFIGURATION ---
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  domain: .local
  reboot_timeout: 30min
  manual_ip:
    static_ip: 192.168.200.45
    gateway: 192.168.200.1
    subnet: 255.255.255.0
    dns1: 192.168.200.1
    
mdns:
  disabled: false

# --- MQTT SETUP ---
mqtt:
  id: mqtt_client                     
  broker: !secret mqtt_host
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password   
  client_id: "esp32s3_diffsteuerung" 
  topic_prefix: "esphome/diff_steuerung"
  discovery: true
  discovery_prefix: homeassistant
  reboot_timeout: 30min

ota:
  - platform: esphome
    encryption:
  - platform: web_server

# --- DALLAS HARDWARE DIAGNOSE-LOGGING ---
logger:
  level: DEBUG
  logs:
    component: INFO
    mqtt: INFO
    wifi: INFO
    dallas.sensor: DEBUG
    dallas_temp.sensor: DEBUG

# --- DIESEN BLOCK HINZUFÜGEN (Behebt den Fehler) ---
http_request:
  timeout: 5s
  verify_ssl: false
  
# --- MODERNER V3 WEBSERVER ---
web_server:
  port: 80
  version: 3
  local: false
  sorting_groups:
    - id: group_main
      name: "📊 Hauptmenü"
    - id: group_manual
      name: "🕹️ Handbetrieb"
    - id: group_setup
      name: "⚙️ Einstellungen"
    - id: group_system
      name: "🛠️ System"

# --- SYSTEMZEIT (NTP) ---
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Berlin"   
    servers:
      - ${zeitserver1}
    update_interval: 21600s    
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        days_of_week: SUN
        then:
          - logger.log: "Wöchentlicher Speicher-Sicherheitsneustart eingeleitet..."
          - delay: 2s
          - button.press: system_reboot

# --- LIVE-TEXT-SENSOREN FÜR DIE WEB-UI (REIHENFOLGE KORRIGIERT) ---
text_sensor:
  - platform: template
    name: "Aktuelle Uhrzeit"
    id: uhrzeit_display
    icon: "mdi:clock-outline"
    update_interval: 1s         
    web_server:
      sorting_group_id: group_main
      sorting_weight: 1         # 1. Platz: Ganz oben
    lambda: |-
      auto time_now = id(sntp_time).now();
      if (!time_now.is_valid()) return {"Warte auf NTP..."};
      static char buffer[32];   
      snprintf(buffer, sizeof(buffer), "%02d:%02d:%02d Uhr", 
               time_now.hour, time_now.minute, time_now.second);
      return {buffer};
      
  - platform: template
    name: "Heizung Statusmeldung"
    id: heizung_statusmeldung
    icon: "mdi:information-outline"
    web_server:
      sorting_group_id: group_main
      sorting_weight: 2         # 2. Platz: Direkt unter der Uhrzeit
    lambda: |-
      if (id(sensor_hard_fault)) {
        return {"Störung, Sensor defekt bitte Prüfen"};
      }

      if (!id(regelung_aktiv).state) {
        return {"Anlage Ausgeschaltet (Standby)"};
      }

      // =================================================================
      // WINTERBETRIEB
      // =================================================================
      if (id(winterbetrieb_schalter).state) {
        if (id(relais_1).state) {
          return {"Winterbetrieb: Pufferladung aktiv"};
        }
        
        std::string pause_state = id(winter_pause_restzeit).state;
        if (pause_state == "Puffer kalt") {
          return {"Winterbetrieb: Warten auf Pufferladung (Kessel kalt)"};
        } else {
          return {"Winterbetrieb: Bereitschaft (Warm genug)"};
        }
      }
      
      // =================================================================
      // ÜBERGANGSBETRIEB
      // =================================================================
      auto time_now = id(sntp_time).now();
      int aktuelle_minuten = (time_now.hour * 60) + time_now.minute;
      
      if (time_now.is_valid() && aktuelle_minuten >= id(entlade_von_min) && aktuelle_minuten < id(entlade_bis_min)) {
        if (id(relais_2).state) {
          return {"Übergangsbetrieb: Puffer Entladung aktiv"};
        } else {
          return {"Übergangsbetrieb: Warmwasserschutz greift (Pufferleerung blockiert)"};
        }
      }
      
      if (time_now.is_valid() && aktuelle_minuten >= id(lade_von_min) && aktuelle_minuten < id(lade_bis_min)) {
        if (id(relais_1).state) {
          return {"Übergangsbetrieb: Solarumladung zu Puffer"};
        } else {
          return {"Übergangsbetrieb: Ladefenster aktiv (Warten auf Solarertrag)"};
        }
      }
      
      return {"Übergangsbetrieb: Bereitschaft (Standby)"};

  - platform: template
    name: "Winter-Pause Restzeit"
    id: winter_pause_restzeit
    icon: "mdi:timer-sand"
    web_server:
      sorting_group_id: group_main
      sorting_weight: 3         # 3. Platz: Direkt unter der Statusmeldung

  # --- GPIO-PIN ANZEIGEN (Ab hier unverändert mit hohem Gewicht für das Setup) ---
  - platform: template
    name: "Pin Brauchwasserspeicher"
    icon: "mdi:serial-port"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 65        
    lambda: 'return {"${pin_bus_bw}"};'

  - platform: template
    name: "Pin Pufferspeicher oben"
    icon: "mdi:serial-port"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 66        
    lambda: 'return {"${pin_bus_puf_ob}"};'

  - platform: template
    name: "Pin Pufferspeicher unten"
    icon: "mdi:serial-port"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 67        
    lambda: 'return {"${pin_bus_puf_unt}"};'

  - platform: template
    name: "Pin Heizkreis vorlauf"
    icon: "mdi:serial-port"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 68        
    lambda: 'return {"${pin_bus_hk_vl}"};'

  - platform: template
    name: "Pin Heizkreis rücklauf"
    icon: "mdi:serial-port"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 69        
    lambda: 'return {"${pin_bus_hk_rl}"};'

  - platform: template
    name: "Pin Kessel Temperatur"
    icon: "mdi:serial-port"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 70        
    lambda: 'return {"${pin_bus_kes}"};'

  - platform: template
    name: "Pin Wohnen2 vorlauf"
    icon: "mdi:serial-port"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 71        
    lambda: 'return {"${pin_bus_hk2_vl}"};'

  - platform: template
    name: "Pin Wohnen2 rücklauf"
    icon: "mdi:serial-port"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 72        
    lambda: 'return {"${pin_bus_hk2_rl}"};'

  - platform: template
    name: "Pin Relais 1 Ladepumpe"
    icon: "mdi:electric-switch"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 75        
    lambda: 'return {"${pin_relais_1} -> ${relais_1_name}"};'

  - platform: template
    name: "Pin Relais 2 Komfort-Widerstand"
    icon: "mdi:electric-switch"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 76        
    lambda: 'return {"${pin_relais_2} -> ${relais_2_name}"};'
    
  - platform: template
    name: "Feuerungsfreigabe"
    icon: "mdi:electric-switch"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 77        
    lambda: 'return {"${pin_relais_3} -> ${relais_3_name}"};'
    
  - platform: template
    name: "Netzwerkadresse Tasmota"
    icon: "mdi:ip-network"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 78        
    lambda: 'return {"${tasmota_ip_fest} (${tasmota_realname})"};'

# --- INITIALISIERUNG DER 8 SEPARATEN BUS-LEITUNGEN MIT AKTIVEM PULLUP ---
one_wire:
  - platform: gpio
    id: bus_bw
    pin: 
      number: ${pin_bus_bw}
      mode: INPUT_PULLUP
  - platform: gpio
    id: bus_puf_ob
    pin: 
      number: ${pin_bus_puf_ob}
      mode: INPUT_PULLUP
  - platform: gpio
    id: bus_puf_unt
    pin: 
      number: ${pin_bus_puf_unt}
      mode: INPUT_PULLUP
  - platform: gpio
    id: bus_hk_vl
    pin: 
      number: ${pin_bus_hk_vl}
      mode: INPUT_PULLUP
  - platform: gpio
    id: bus_hk_rl
    pin: 
      number: ${pin_bus_hk_rl}
      mode: INPUT_PULLUP
  - platform: gpio
