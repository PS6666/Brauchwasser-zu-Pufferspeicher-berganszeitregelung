# --- CODESYSTEM FÜR FLEXIBLE ZEITEINSTELLUNGEN ---
text:
  - platform: template
    name: "Solar-Ladefenster Start"
    id: ui_lade_start
    initial_value: "11:30"
    mode: text
    min_length: 5
    max_length: 5
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 51
    on_value:
      then:
        - lambda: |-
            int h = 0, m = 0;
            if (sscanf(x.c_str(), "%d:%d", &h, &m) == 2) {
              id(lade_von_min) = (h * 60) + m;
            }

  - platform: template
    name: "Solar-Ladefenster Ende"
    id: ui_lade_stop
    initial_value: "16:30"
    mode: text
    min_length: 5
    max_length: 5
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 52
    on_value:
      then:
        - lambda: |-
            int h = 0, m = 0;
            if (sscanf(x.c_str(), "%d:%d", &h, &m) == 2) {
              id(lade_bis_min) = (h * 60) + m;
            }

  - platform: template
    name: "Entladefenster Start"
    id: ui_entlade_start
    initial_value: "05:30"
    mode: text
    min_length: 5
    max_length: 5
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 53
    on_value:
      then:
        - lambda: |-
            int h = 0, m = 0;
            if (sscanf(x.c_str(), "%d:%d", &h, &m) == 2) {
