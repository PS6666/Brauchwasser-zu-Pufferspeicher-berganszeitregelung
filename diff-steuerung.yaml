# --- BLOCK 4: 🛠️ SYSTEMSTEUERUNG ---
button:
  - platform: restart
    name: "System-Neustart Reboot"
    id: system_reboot
    icon: "mdi:restart"
    web_server:
      sorting_group_id: group_system
      sorting_weight: 91  

  - platform: template
    name: "Störung quittieren (Sensor-Reset)"
    id: sensor_fault_reset
    icon: "mdi:alert-check"
    web_server:
      sorting_group_id: group_setup
      sorting_weight: 79        
    on_press:
      then:
        - lambda: |-
            id(sensor_reboot_count) = 0;
            id(sensor_hard_fault) = false;
            ESP_LOGW("sensor_check", "Manueller Fehler-Reset ausgelöst. Setze Zähler zurück...");
        - text_sensor.template.publish:
            id: heizung_statusmeldung
            state: "Prüfe Sensoren nach Reset..."
        - script.execute: pruefe_hauptsensoren
      
# --- SKRIPT (PLUG & PLAY ERWEITERT OHNE AUTOMATISCHE REBOOT-SCHLEIFE) ---
script:
  - id: pruefe_hauptsensoren
    then:
      - delay: 20s          
      - lambda: |-
          bool kern_da = id(sensor_brauchwasser).has_state() && 
                         id(sensor_puffer_oben).has_state() && 
                         id(sensor_puffer_unten).has_state();

          if (kern_da) {
            id(sensor_reboot_count) = 0;
            id(sensor_hard_fault) = false;
            ESP_LOGI("sensor_check", "Kernsensoren erfolgreich erkannt. Betrieb läuft.");
          } else {
            id(sensor_reboot_count)++;
            ESP_LOGE("sensor_check", "Sensor fehlt beim Tausch! Versuch %d von 3", id(sensor_reboot_count));

            if (id(sensor_reboot_count) < 3) {
              ESP_LOGW("sensor_check", "Warte auf Sensor-Stabilisierung (Fehler im Webmenü quittieren)");
            } else {
              id(sensor_hard_fault) = true;
              ESP_LOGE("sensor_check", "CRITICAL: Sensor dauerhaft getrennt. Bitte Fühler prüfen!");
            }
          }
          
# ===================================================================================
# CORESYSTEM-REGLER: MATHE-GESTEUERTE HYDRAULIKLOGIK (MIT PUFFER-WARTELOGIK)
# ===================================================================================
interval:
  - interval: ${regel_takt}
    then:
      - lambda: |-
          // =================================================================
          // DYNAMISCHE FLANKENERKENNUNG FÜR DIE PUMPEN-MINDESTLAUFZEIT
          // =================================================================
          static uint32_t pumpe_gestartet_am = 0;
          static bool pumpe_war_an = false;
          uint32_t jetzt = millis();

          if (id(relais_1).state && !pumpe_war_an) {
            pumpe_gestartet_am = jetzt;
            pumpe_war_an = true;
          } 
          else if (!id(relais_1).state) {
            pumpe_war_an = false;
          }

          bool min_laufzeit_erreicht = (!pumpe_war_an) || (jetzt - pumpe_gestartet_am >= ${pumpe_min_on_ms});

          // Live-Aktualisierung der Status-Bits für die Weboberfläche
          id(status_relais_1).publish_state(id(relais_1).state);
          id(status_relais_2).publish_state(id(relais_2).state);
          id(status_relais_3).publish_state(id(relais_3).state);
          id(status_tasmota).publish_state(id(ak2_tasmota).state);

          // 1. HARDWARE-NOT-AUS: Wenn Sensoren defekt sind, ALLES HART AUSSCHALTEN
          if (id(sensor_hard_fault)) {
            id(relais_1).turn_off();
            id(relais_2).turn_off();
            id(relais_3).turn_off();
            if (id(ak2_tasmota).state) id(ak2_tasmota).turn_off();
            return; 
          }

          // 2. HANDBETRIEB-SCHUTZ: Wenn Automatik in der UI aus ist, abbrechen
          if (!id(automatik_freigabe).state) {
            return;
          }

          // 3. REGELUNG KOMPLETT AUS -> Alle Ausgänge hart abschalten
          if (!id(regelung_aktiv).state) {
            id(relais_1).turn_off();                               
            id(relais_2).turn_off();                               
            id(relais_3).turn_off(); 
            if (id(ak2_tasmota).state) id(ak2_tasmota).turn_off(); 
            return; 
          }

          // =================================================================
          // STRATEGISCHE FEUERUNGSFREIGABE (MIT STRENGER 45°C WARTE-LOGIK)
          // =================================================================
          if (id(sensor_puffer_oben).has_state() && id(sensor_kessel).has_state()) {
            float t_puf_ob_aktuell = id(sensor_puffer_oben).state;
            float t_kes_aktuell    = id(sensor_kessel).state;
            
            float ein_grenze       = ${win_puff_ob};   // 45 °C (Einschalt-Schwelle)
            float aus_grenze       = ${puff_max_lad};  // 75 °C (Ausschalt-Schwelle)
            float kessel_heiss     = 50.0f;            // Kessel brennt aktiv
            float kessel_ausgebrannt = 45.0f;          // Kessel physikalisch kalt

            // Wenn der User die Automatik in der UI ausgeschaltet hat -> Sofort aus
            if (!id(ui_feuerungsfreigabe).state) {
              if (id(relais_3).state) {
                id(relais_3).turn_off();
                ESP_LOGI("feuerung", "USER-STOPP: Anzündanforderung entzogen.");
              }
            } 
            else {
              // SCHUTZ-SZENARIO 1: Puffer oben hat 75 °C erreicht -> AUSBRAND & UI-SPERRE (AUS)
              if (t_puf_ob_aktuell >= aus_grenze) {
                if (id(relais_3).state || id(ui_feuerungsfreigabe).state) {
                  id(relais_3).turn_off();             // Relais öffnen -> Ausbrandphase
                  id(ui_feuerungsfreigabe).turn_off(); // Schalter in der UI sperren (Verriegelung)
                  ESP_LOGW("feuerung", "AUSBRAND: Puffer voll (%0.1f°C). Relais 3 geöffnet und verriegelt.", t_puf_ob_aktuell);
                }
              }
              // SCHUTZ-SZENARIO 2: Puffer ist noch warm (über 45 °C)
              else if (t_puf_ob_aktuell >= ein_grenze && t_puf_ob_aktuell < aus_grenze) {
                
                if (id(relais_3).state) {
                  // Wenn das Relais bereits läuft (Abbrand aktiv), bleibt es an bis 75 °C erreicht sind!
                  ESP_LOGD("feuerung", "ABBRAND AKTIV: Puffer oben bei %0.1f°C. Relais bleibt geschlossen.", t_puf_ob_aktuell);
                } 
                else {
                  // Wenn das Relais aus war (Szenario B): Prüfe, ob du manuell angeheizt hast
                  if (t_kes_aktuell >= kessel_heiss) {
                    // Kessel ist heiß (> 50°C), das bedeutet du hast manuell angeheizt -> REBOOT-RESTORE / START!
                    id(relais_3).turn_on();
                    ESP_LOGW("feuerung", "START: Kessel ist heiß (%0.1f°C). Anforderung aktiviert.", t_kes_aktuell);
                  } else {
                    // Kessel ist kalt und Puffer ist warm -> REGELUNG WARTET AKTIV!
                    ESP_LOGI("feuerung", "WARTE-MODUS: Schalter ist EIN, aber Regelung wartet aktiv, bis Puffer unter 45°C fällt (Aktuell: %0.1f°C).", t_puf_ob_aktuell);
                  }
                }
              }
              // SCHUTZ-SZENARIO 3: Puffer oben hat die 45 °C unterschritten -> START-FREIGABE
              else if (t_puf_ob_aktuell < ein_grenze) {
                
                if (id(ui_feuerungsfreigabe).state) {
                  if (!id(relais_3).state) {
                    // Puffer ist unter 45°C gefallen -> Jetzt schaltet das Relais 3 endlich ein!
                    id(relais_3).turn_on();
                    ESP_LOGW("feuerung", "START-FREIGABE: Puffer unter 45°C gefallen (%0.1f°C). Relais 3 geschlossen!", t_puf_ob_aktuell);
                  }
                }
              }
            }
          }

          // =================================================================
          // FALL 2: WINTERZEIT (Rein temperaturgeführt für Ladepumpe)
          // =================================================================
          if (id(winterbetrieb_schalter).state) {
            if (!id(ak2_tasmota).state) id(ak2_tasmota).turn_on();

            if (!id(sensor_brauchwasser).has_state() || !id(sensor_puffer_oben).has_state()) {
              if (id(relais_1).state && min_laufzeit_erreicht) id(relais_1).turn_off();
              id(relais_2).turn_off();
              return;
            }

            float t_bw = id(sensor_brauchwasser).state;
            float t_puf_ob = id(sensor_puffer_oben).state;
            float winter_diff = t_puf_ob - t_bw;

            if (t_bw >= ${bw_max_lad} || (t_puf_ob < ${win_puff_ob} && winter_diff < id(diff_ein).state)) {
              if (id(relais_1).state && min_laufzeit_erreicht) {
                id(relais_1).turn_off();
                id(winter_pause_restzeit).publish_state(t_bw >= ${bw_max_lad} ? "Warm genug" : "Puffer kalt");
              }
              id(relais_2).turn_off();
              return;
            }

            if (!id(relais_1).state && t_puf_ob >= ${win_puff_ob} && winter_diff >= id(diff_ein).state) {
              id(relais_1).turn_on();
              id(winter_pause_restzeit).publish_state("Ladung active");
            } 
            else if (id(relais_1).state && winter_diff <= id(diff_aus).state) {
              if (min_laufzeit_erreicht) {
                id(relais_1).turn_off();
                id(winter_pause_restzeit).publish_state("Bereit (Hysterese)");
              }
            }

            id(relais_2).turn_off();
            return; 
          }
          
          // =================================================================
          // FALL 3: ÜBERGANGSZEIT
          // =================================================================
          if (!id(sensor_brauchwasser).has_state() || !id(sensor_puffer_oben).has_state() || !id(sensor_puffer_unten).has_state()) {
            id(relais_1).turn_off(); 
            id(relais_2).turn_off();
            if (id(ak2_tasmota).state) id(ak2_tasmota).turn_off();
            return;
          }

          float t_bw      = id(sensor_brauchwasser).state;  
          float t_puf_ob  = id(sensor_puffer_oben).state;   
          float t_puf_unt = id(sensor_puffer_unten).state;  
          
          float bw_min_crit  = id(brauchwasser_min).state;        
          float puf_min_crit = id(puffer_min_ausschalt).state;    
          float puf_max_crit = ${puffer_max_wert};                

          auto time_now = id(sntp_time).now();
          int aktuelle_minuten = (time_now.hour * 60) + time_now.minute;

          int lade_von    = id(lade_von_min);
          int lade_bis    = id(lade_bis_min);
          int entlade_von = id(entlade_von_min);
          int entlade_bis = id(entlade_bis_min);

          // ROUTINE 1: MORGENDLICHE HEIZKREIS-ENTLADUNG (05:30 - 07:30 Uhr)
          bool entladefenster_aktiv = (time_now.is_valid() && aktuelle_minuten >= entlade_von && aktuelle_minuten < entlade_bis);

          if (entladefenster_aktiv) {
            id(relais_1).turn_off(); 

            if (t_bw >= bw_min_crit && t_puf_unt >= puf_min_crit) {
              if (!id(ak2_tasmota).state) id(ak2_tasmota).turn_on(); 
              id(relais_2).turn_on();                                
            } 
            else {
              if (id(ak2_tasmota).state) id(ak2_tasmota).turn_off(); 
              id(relais_2).turn_off();                               
            }
            return; 
          }
          
          // ROUTINE 2: MITTÄGLICHE SOLAR-UMLADUNG (Brauchwasser -> Puffer)
          bool ladefenster_aktiv = (time_now.is_valid() && aktuelle_minuten >= lade_von && aktuelle_minuten < lade_bis);

          if (ladefenster_aktiv) {
            if (id(ak2_tasmota).state) id(ak2_tasmota).turn_off(); 
            id(relais_2).turn_off();                               

            if (t_puf_ob < puf_max_crit) {
              float umschicht_ertrag = t_bw - t_puf_unt; 

              if (!id(relais_1).state && umschicht_ertrag >= id(diff_ein).state) {
                id(relais_1).turn_on(); 
              }
              else if (id(relais_1).state && umschicht_ertrag < id(diff_aus).state) {
                if (min_laufzeit_erreicht) id(relais_1).turn_off();
              }
            } 
            else {
              if (id(relais_1).state && min_laufzeit_erreicht) id(relais_1).turn_off();
            }
            return; 
          }
          
          // ROUTINE 3: STANDBY AUẞERHALB DER STEUERZEITEN
          id(relais_1).turn_off();
          id(relais_2).turn_off();
          if (id(ak2_tasmota).state) id(ak2_tasmota).turn_off();
