    icon: "mdi:heating-coil"
    optimistic: true
    web_server:
      sorting_group_id: group_manual
      sorting_weight: 32        
    turn_on_action:
      - switch.turn_off: automatik_freigabe
      - switch.turn_on: relais_2            
    turn_off_action:
      - switch.turn_off: relais_2           
      - switch.turn_on: automatik_freigabe  
        
  - platform: template
    name: "${relais_3_name} Handbetrieb (Test)" 
    id: ui_feuerungsfreigabe_manu
    icon: "mdi:fire"                      
    optimistic: true
    web_server:
      sorting_group_id: group_manual
      sorting_weight: 33                  
    turn_on_action:
      - switch.turn_off: automatik_freigabe 
      - switch.turn_on: relais_3            
    turn_off_action:
      - switch.turn_off: relais_3           
      - switch.turn_on: automatik_freigabe  

  - platform: template
    name: ${tasmota_realname}
