          state: !lambda "return x;"
          
  - platform: gpio
    pin:
      number: ${pin_relais_3}
      inverted: ${relais_invertiert}
    id: relais_3
    internal: true 
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - binary_sensor.template.publish:
          id: status_relais_3
          state: !lambda "return x;"
          
  # Handbetrieb
