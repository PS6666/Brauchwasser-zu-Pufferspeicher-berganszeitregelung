            if (sscanf(x.c_str(), "%d:%d", &h, &m) == 2) {
              id(entlade_bis_min) = (h * 60) + m;
            }

# --- SENSOR-BEREICH (PLUG & PLAY ÜBER INDEX 0 GEWÄHRLEISTET) ---
sensor:
  - platform: dallas_temp
    one_wire_id: bus_bw
    index: 0                    
    id: sensor_brauchwasser
    filters:
      - filter_out: NAN 
    name: ${sensor1_bw}   
    update_interval: ${sensor_intval_time}        
    web_server:
      sorting_group_id: group_main
      sorting_weight: 4         

  - platform: dallas_temp
    one_wire_id: bus_puf_ob
    index: 0                    
    id: sensor_puffer_oben
    filters:
      - filter_out: NAN     
    name: ${sensor2_puf_ob}    
    update_interval: ${sensor_intval_time}
    web_server:
      sorting_group_id: group_main
      sorting_weight: 5         

  - platform: dallas_temp
    one_wire_id: bus_puf_unt
    index: 0                    
    id: sensor_puffer_unten
    filters:
      - filter_out: NAN     
    name: ${sensor3_puf_unt} 
    update_interval: ${sensor_intval_time}
    web_server:
      sorting_group_id: group_main
      sorting_weight: 6         

  - platform: dallas_temp
    one_wire_id: bus_hk_vl
    index: 0                    
    id: sensor_hk_vl
    filters:
      - filter_out: NAN     
    name: ${sensor4_hk_vl}
    update_interval: ${sensor_intval_time}
    web_server:
      sorting_group_id: group_main
      sorting_weight: 7         

  - platform: dallas_temp
    one_wire_id: bus_hk_rl
    index: 0                    
    id: sensor_hk_rl
    filters:
      - filter_out: NAN     
    name: ${sensor5_hk_rl}
    update_interval: ${sensor_intval_time}
    web_server:
      sorting_group_id: group_main
      sorting_weight: 8         

  - platform: dallas_temp
    one_wire_id: bus_kes
    index: 0                    
    id: sensor_kessel
    filters:
      - filter_out: NAN     
    name: ${sensor6_kes}
    update_interval: ${sensor_intval_time}
    web_server:
      sorting_group_id: group_main
      sorting_weight: 9         

  - platform: dallas_temp
    one_wire_id: bus_hk2_vl
    index: 0                    
    id: sensor_hk2_vl
    filters:
      - filter_out: NAN     
    name: ${sensor7_hk2_vl}
    update_interval: ${sensor_intval_time}
    web_server:
      sorting_group_id: group_main
      sorting_weight: 10         

  - platform: dallas_temp
    one_wire_id: bus_hk2_rl
    index: 0                    
    id: sensor_hk2_rl
    filters:
      - filter_out: NAN     
    name: ${sensor8_hk2_rl}
    update_interval: ${sensor_intval_time}
    web_server:
      sorting_group_id: group_main
      sorting_weight: 11         

  # --- Prozent-Ladestandsanzeigen ---
  - platform: template
    name: "Brauchwasser-Ladestatus"
    id: brauchwasser_ladestatus
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery-charging-60"
    web_server:
      sorting_group_id: group_main
      sorting_weight: 12        
    update_interval: ${sensor_intval_time}
    lambda: |-
      if (!id(sensor_brauchwasser).has_state()) return {};
      float t_aktuell = id(sensor_brauchwasser).state;
      float t_max = ${bw_max_lad};
      float t_basis = 18.0f; 
      if (t_aktuell <= t_basis) return 0.0f;
      if (t_aktuell >= t_max) return 100.0f;
      return ((t_aktuell - t_basis) / (t_max - t_basis)) * 100.0f;

  - platform: template
    name: "Pufferspeicher-Ladestatus"
    id: pufferspeicher_ladestatus
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:battery-charging-80"
    web_server:
      sorting_group_id: group_main
      sorting_weight: 13        
    update_interval: ${sensor_intval_time}
    lambda: |-
      if (!id(sensor_puffer_oben).has_state() || !id(sensor_puffer_unten).has_state()) return {};
      float t_mittel = (id(sensor_puffer_oben).state + id(sensor_puffer_unten).state) / 2.0f;
      float t_max = ${puff_max_lad};
      float t_basis = 18.0f; 
      if (t_mittel <= t_basis) return 0.0f;
      if (t_mittel >= t_max) return 100.0f;
      return ((t_mittel - t_basis) / (t_max - t_basis)) * 100.0f;   

  # --- Mathematische Leistungssensoren (kW) ---
  - platform: template
    name: "Heizleistung"
    id: leistung_kessel
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    icon: "mdi:fire"
    web_server:
      sorting_group_id: group_main
      sorting_weight: 14        
    update_interval: ${sensor_intval_time}
    lambda: |-
      if (!id(ak2_tasmota).state) return 0.0f;
      if (!id(sensor_kessel).has_state() || !id(sensor_hk_rl).has_state()) return {};
      float dt = id(sensor_kessel).state - id(sensor_hk_rl).state;
      if (dt < 0.0f) dt = 0.0f;
      return (${mitt_durchfl} * 4.182f * dt) / 3600.0f;

  - platform: template
    name: "Solarüberschuss"
    id: leistung_solaruewerschuss
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    icon: "mdi:solar-power"
    web_server:
      sorting_group_id: group_main
      sorting_weight: 15        
    update_interval: ${sensor_intval_time}
    lambda: |-
      if (!id(relais_1).state) return 0.0f;
      if (!id(sensor_brauchwasser).has_state() || !id(sensor_puffer_unten).has_state()) return {};
      float dt = id(sensor_brauchwasser).state - id(sensor_puffer_unten).state;
      if (dt < 0.0f) dt = 0.0f;
      return (${mitt_durchfl} * 4.182f * dt) / 3600.0f;

  - platform: template
    name: "Heizkreis-Entladeleistung"
    id: leistung_hk_gesamt
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    icon: "mdi:radiator"
    web_server:
      sorting_group_id: group_main
      sorting_weight: 16        
    update_interval: ${sensor_intval_time}
    lambda: |-
      if (!id(ak2_tasmota).state) return 0.0f;
      if (!id(sensor_hk_vl).has_state() || !id(sensor_hk_rl).has_state()) return {};
      float dt = id(sensor_hk_vl).state - id(sensor_hk_rl).state;
      if (dt < 0.0f) dt = 0.0f;
      return (${mitt_durchfl} * 4.182f * dt) / 3600.0f;

  - platform: template
    name: "Heizkreis Wohnen2"
    id: leistung_hk2_wohnen
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    icon: "mdi:home-floor-1"
    web_server:
      sorting_group_id: group_main
      sorting_weight: 17        
    update_interval: ${sensor_intval_time}
    lambda: |-
      if (!id(ak2_tasmota).state) return 0.0f;
      if (!id(sensor_hk2_vl).has_state() || !id(sensor_hk2_rl).has_state()) return {};
      float dt = id(sensor_hk2_vl).state - id(sensor_hk2_rl).state;
